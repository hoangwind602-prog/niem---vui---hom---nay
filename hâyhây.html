<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Climb Prototype by Seri</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#f3f3f3;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    background:linear-gradient(to bottom,#ffffff,#dddddd);
    touch-action:none;
}

.ui{
    position:fixed;
    top:15px;
    left:15px;
    background:rgba(255,255,255,0.8);
    padding:12px 16px;
    border-radius:16px;
    backdrop-filter:blur(10px);
    z-index:10;
}

.ui h1{
    font-size:18px;
    margin-bottom:6px;
}

.ui p{
    font-size:14px;
    line-height:1.5;
}
</style>
</head>
<body>

<div class="ui">
    <h1>CLIMB</h1>
    <p>
        Kéo tay nhân vật để leo.<br>
        Bám đúng điểm để không rơi nhá.
    </p>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let cameraY = 0;

const player = {
    x: canvas.width/2,
    y: canvas.height-150,

    bodyRadius: 22,

    leftHand:{
        x:0,
        y:0,
        attached:true
    },

    rightHand:{
        x:0,
        y:0,
        attached:true
    },

    velocityY:0,
    sway:0
};

player.leftHand.x = player.x - 60;
player.leftHand.y = player.y - 50;

player.rightHand.x = player.x + 60;
player.rightHand.y = player.y - 50;

const holds = [];

function createHolds(){
    for(let i=0;i<60;i++){
        holds.push({
            x: 80 + Math.random()*(canvas.width-160),
            y: canvas.height - i*140,
            r:20,
            color:["#ff7b54","#a855f7","#22c55e"][i%3]
        });
    }
}
createHolds();

let dragging = null;

function getTouchPos(e){
    const rect = canvas.getBoundingClientRect();

    if(e.touches){
        return {
            x:e.touches[0].clientX - rect.left,
            y:e.touches[0].clientY - rect.top + cameraY
        };
    }

    return {
        x:e.clientX - rect.left,
        y:e.clientY - rect.top + cameraY
    };
}

function distance(ax,ay,bx,by){
    return Math.hypot(ax-bx, ay-by);
}

function startDrag(x,y){
    if(distance(x,y,player.leftHand.x,player.leftHand.y) < 40){
        dragging = player.leftHand;
    }
    else if(distance(x,y,player.rightHand.x,player.rightHand.y) < 40){
        dragging = player.rightHand;
    }
}

function moveDrag(x,y){
    if(dragging){
        dragging.x = x;
        dragging.y = y;
    }
}

function endDrag(){

    if(dragging){

        let attached = false;

        for(let hold of holds){

            if(distance(
                dragging.x,
                dragging.y,
                hold.x,
                hold.y
            ) < 35){

                dragging.x = hold.x;
                dragging.y = hold.y;

                attached = true;

                player.velocityY = -6;

                break;
            }
        }

        if(!attached){
            player.velocityY += 4;
        }
    }

    dragging = null;
}

canvas.addEventListener("mousedown",(e)=>{
    const pos = getTouchPos(e);
    startDrag(pos.x,pos.y);
});

canvas.addEventListener("mousemove",(e)=>{
    const pos = getTouchPos(e);
    moveDrag(pos.x,pos.y);
});

canvas.addEventListener("mouseup",()=>{
    endDrag();
});

canvas.addEventListener("touchstart",(e)=>{
    const pos = getTouchPos(e);
    startDrag(pos.x,pos.y);
});

canvas.addEventListener("touchmove",(e)=>{
    const pos = getTouchPos(e);
    moveDrag(pos.x,pos.y);
});

canvas.addEventListener("touchend",()=>{
    endDrag();
});

function update(){

    player.velocityY += 0.25;
    player.y += player.velocityY;

    const avgX =
        (player.leftHand.x + player.rightHand.x)/2;

    const avgY =
        (player.leftHand.y + player.rightHand.y)/2;

    player.x += (avgX - player.x)*0.08;

    player.y += ((avgY+100)-player.y)*0.08;

    if(player.y-cameraY < canvas.height*0.4){
        cameraY = player.y - canvas.height*0.4;
    }

    if(player.y > canvas.height + cameraY + 400){

        player.y = canvas.height-150;
        cameraY = 0;

        player.leftHand.x = player.x - 60;
        player.leftHand.y = player.y - 50;

        player.rightHand.x = player.x + 60;
        player.rightHand.y = player.y - 50;
    }
}

function drawHolds(){

    for(let hold of holds){

        ctx.beginPath();

        ctx.arc(
            hold.x,
            hold.y-cameraY,
            hold.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle = hold.color;
        ctx.fill();
    }
}

function drawPlayer(){

    const bodyY = player.y-cameraY;

    ctx.lineWidth = 8;
    ctx.strokeStyle = "#444";

    // tay trái
    ctx.beginPath();
    ctx.moveTo(player.x,bodyY);
    ctx.lineTo(
        player.leftHand.x,
        player.leftHand.y-cameraY
    );
    ctx.stroke();

    // tay phải
    ctx.beginPath();
    ctx.moveTo(player.x,bodyY);
    ctx.lineTo(
        player.rightHand.x,
        player.rightHand.y-cameraY
    );
    ctx.stroke();

    // thân
    ctx.beginPath();
    ctx.arc(
        player.x,
        bodyY,
        player.bodyRadius,
        0,
        Math.PI*2
    );

    ctx.fillStyle = "#ff8c69";
    ctx.fill();

    // chân
    ctx.beginPath();
    ctx.moveTo(player.x,bodyY+20);
    ctx.lineTo(player.x-25,bodyY+70);

    ctx.moveTo(player.x,bodyY+20);
    ctx.lineTo(player.x+25,bodyY+70);

    ctx.stroke();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawHolds();
    drawPlayer();

    ctx.fillStyle = "#222";
    ctx.font = "20px Arial";

    ctx.fillText(
        "HEIGHT: " + Math.floor(cameraY*-1),
        canvas.width-190,
        40
    );
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
